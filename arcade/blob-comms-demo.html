<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>BLOB COMMS — embed demo (any screen)</title>
<style>
  body{margin:0;background:#10101c;color:#e8e0c8;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
  h1{font-size:22px;font-weight:normal;letter-spacing:1px;text-align:center;padding:0 20px}
  h1 small{display:block;margin-top:10px;font-size:13px;color:#9fb6cc;line-height:1.6}
</style>
</head>
<body>
<h1>ANY SCREEN<small>this page is deliberately plain — everything else on it is the BLOB COMMS layover,<br/>pulled in by its blob, verified by its hash, and mounted. That is the whole demo.</small></h1>
<div id="mount"></div>
<script>
/* The loader pattern, shrunk to fit a stranger's page: recall the plugin
   blob down the mirror ladder, verify its sha256 byte-for-byte, and only
   then let it run. If the hash ever lies, nothing runs. */
(function(){
'use strict';
var PLUGIN_BLOB='jpy2FG1Xnbb8kdZb2SmxKeIm24yldmN68JAvJkLt_Io';
var PLUGIN_SHA='041c26445293c675012d30e8274ec45bd7ae932e51b6a5ac8b761dbf934d2971';
var MIRRORS=['https://aggregator.walrus-testnet.walrus.space','https://walrus-testnet.blockscope.net'];
function sha256hex(data){ /* pure-JS SHA-256 (FIPS 180-4) — crypto.subtle is undefined on http pages */
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var bytes=data instanceof Uint8Array?data:new TextEncoder().encode(String(data));
  var bitLen=bytes.length*8, withOne=bytes.length+1, pad=(56-(withOne%64)+64)%64, total=withOne+pad+8;
  var msg=new Uint8Array(total); msg.set(bytes); msg[bytes.length]=0x80;
  var dv=new DataView(msg.buffer); dv.setUint32(total-4,bitLen>>>0); dv.setUint32(total-8,Math.floor(bitLen/4294967296));
  var W=new Uint32Array(64); function rr(x,n){return (x>>>n)|(x<<(32-n));}
  for(var off=0;off<total;off+=64){
    var i; for(i=0;i<16;i++) W[i]=dv.getUint32(off+i*4);
    for(i=16;i<64;i++){ var s0=rr(W[i-15],7)^rr(W[i-15],18)^(W[i-15]>>>3), s1=rr(W[i-2],17)^rr(W[i-2],19)^(W[i-2]>>>10); W[i]=(W[i-16]+s0+W[i-7]+s1)|0; }
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(i=0;i<64;i++){ var S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[i]+W[i])|0, S0=rr(a,2)^rr(a,13)^rr(a,22), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)|0; h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0; }
    H=[(H[0]+a)|0,(H[1]+b)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
  }
  return H.map(function(x){return ('00000000'+(x>>>0).toString(16)).slice(-8);}).join('');
}
window.__evts=[];
window.__commsReady=(async function(){
  var bytes=null, lastErr=null;
  for(var mi=0; mi<MIRRORS.length && !bytes; mi++){
    try{
      var r=await fetch(MIRRORS[mi]+'/v1/blobs/'+PLUGIN_BLOB);
      if(!r.ok) throw new Error('mirror '+r.status);
      var buf=new Uint8Array(await r.arrayBuffer());
      if(sha256hex(buf)!==PLUGIN_SHA) throw new Error('sha mismatch — refused');
      bytes=buf;
    }catch(e){ lastErr=e; }
  }
  if(!bytes) throw lastErr||new Error('plugin blob unreachable');
  var url=URL.createObjectURL(new Blob([bytes],{type:'text/javascript'}));
  await new Promise(function(res, rej){ var s=document.createElement('script'); s.src=url; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  var qs=new URLSearchParams(location.search);
  var handle=window.BlobComms.mount(document.getElementById('mount'), {
    ns:'demo',
    room: qs.get('room')||undefined,
    name: qs.get('name')||undefined,
    onPeerStream:function(tid, stream, info){ window.__evts.push({ev:'peerStream', tid:tid, self:!!info.self, hasAudio:info.hasAudio, hasVideo:info.hasVideo, streamId:stream.id, tracks:stream.getTracks().map(function(t){return t.kind;}).join('+')||'none'}); },
    onPeerGone:function(tid){ window.__evts.push({ev:'peerGone', tid:tid}); }
  });
  window.__comms=handle;
  return handle;
})();
})();
</script>
</body>
</html>
