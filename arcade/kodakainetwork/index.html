<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koda Kai Network — entering the station…</title>
<meta http-equiv="refresh" content="3;url=https://arcade.highscores.live/network/">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#0a0a18; color:#e8e8f5; font-family:'Courier New',monospace; min-height:100vh;
         display:flex; align-items:center; justify-content:center;
         background-image:radial-gradient(circle at 50% 0%, #1a1a3a 0%, #0a0a18 60%); }
  .wrap { text-align:center; padding:32px; }
  .art { font-size:4rem; filter:drop-shadow(0 0 18px #0af); animation:bob 2s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-10px); } }
  h1 { color:#22d3ee; letter-spacing:.15em; margin:18px 0 10px; font-size:clamp(1.4rem,5vw,2.2rem);
       text-shadow:0 0 18px #22d3ee; }
  p { color:#b9b9d8; letter-spacing:.1em; }
  a { color:#22d3ee; }
  .dots::after { content:''; animation:dots 1.2s steps(4) infinite; }
  @keyframes dots { 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} }
</style>
</head>
<body>
<div class="wrap">
  <div class="art">🌊</div>
  <h1>KODA KAI NETWORK</h1>
  <p>Tuning the dial<span class="dots"></span> entering the station</p>
  <p style="margin-top:18px;font-size:.85rem"><a href="https://arcade.highscores.live/network/">Click here if you aren't redirected</a></p>
</div>
<script>
  var url = "https://arcade.highscores.live/network/";
  setTimeout(function(){
    try { window.top.location.href = url; }
    catch(e){ window.location.href = url; }
  }, 1200);
</script>
</body>
</html>
