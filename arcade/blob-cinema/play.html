<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>▶ BLOB CINEMA REPLAY</title>
<style>
body{background:#07070f;color:#e8e8ff;font-family:system-ui,sans-serif;margin:0;padding:14px}
.lbl{color:#9a9ac0;font-size:.8rem}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.panel{background:#101022;border:1px solid #26264d;border-radius:12px;padding:14px;margin:12px 0}
video{width:100%;max-width:800px;background:#000;border-radius:8px}
.btn{background:#1a1a33;border:1px solid #33336a;color:#e8e8ff;border-radius:8px;padding:8px 14px;cursor:pointer;margin:4px;text-decoration:none;display:inline-block}
#timeline{width:100%;max-width:800px;margin:8px 0}
.cap{color:#ffd76b;font-size:.9rem;min-height:1.2em}
</style>
</head>
<body>
<script src="./errcatch.js"></script>
<h1>▶ <span id="title">loading…</span></h1>
<p class="lbl"><a href="./reblob.html">📚 library</a> · <a href="./live.html">🔴 live</a> · <a href="./index.html">← theater</a></p>
<div class="panel">
  <video id="v" controls playsinline></video><br>
  <input type="range" id="timeline" min="0" max="100" value="0" oninput="scrub(this.value)">
  <div><span class="lbl" id="pos">chunk 0 / 0</span> · <span class="lbl" id="stat">loading manifest…</span></div>
  <div class="cap" id="caption"></div>
  <div id="highlights" style="margin:8px 0"></div>
  <div class="mono" style="font-size:.75rem;margin-top:8px" id="proof"></div>
</div>
<script>
const GH='https://arcade.highscores.live/arcade/blob-cinema';
const AGG='https://aggregator.walrus-testnet.walrus.space';
const $=id=>document.getElementById(id);
const hex=b=>Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join('');
const bhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
// minimal sha256 (pure JS, HTTP-safe) for key derivation
async function sha256hex(u8){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e358c,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const ml=u8.length,bitLen=ml*8,pad=((ml+9+63)>>6)<<6,m=new Uint8Array(pad);
  m.set(u8);m[ml]=0x80;const dv=new DataView(m.buffer);
  dv.setUint32(pad-4,bitLen>>>0);dv.setUint32(pad-8,Math.floor(bitLen/4294967296));
  const w=new Uint32Array(64);
  for(let o=0;o<pad;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const s0=((w[i-15]>>>7)|(w[i-15]<<25))^((w[i-15]>>>18)|(w[i-15]<<14))^(w[i-15]>>>3),s1=((w[i-2]>>>17)|(w[i-2]<<15))^((w[i-2]>>>19)|(w[i-2]<<13))^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
    let[a,b,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)),ch=(e&f)^(~e&g),t1=(hh+S1+ch+K[i]+w[i])|0,S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)|0;hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}
    h=[(h[0]+a)|0,(h[1]+b)|0,(h[2]+c)|0,(h[3]+d)|0,(h[4]+e)|0,(h[5]+f)|0,(h[6]+g)|0,(h[7]+hh)|0];
  }
  return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
let manifest=null, keyChain=[], playIdx=0, ms=null, sb=null, playing=false;
// nacl minimal (secretbox only) — injected from live.html's proven copy
</script>
<script src="./nacl-min.js"></script>
<script>
async function deriveKey(prev){ const h=await sha256hex(new Uint8Array([...prev,...new TextEncoder().encode('|next')])); return bhex(h); }
let _keyLock=Promise.resolve();
async function keyAt(i){
  // serialize: concurrent callers must not interleave the derive+push loop,
  // or duplicate keys shift every index and chunks decrypt with the wrong key
  const p=_keyLock.then(async()=>{
    while(keyChain.length<=i) keyChain.push(await deriveKey(keyChain[keyChain.length-1]));
    return keyChain[i];
  });
  _keyLock=p.catch(()=>{});
  return p;
}
function unwrap(cipher,key){ const dec=nacl.secretbox.open(cipher.slice(24),cipher.slice(0,24),key); return dec?new Uint8Array(dec):null; }
async function load(){
  const id=new URLSearchParams(location.search).get('id');
  if(!id){ $('stat').textContent='no stream id'; return; }
  // try GitHub first, then localStorage
  try{
    const r=await fetch(`${GH}/live-streams/${id}.json?v=`+Date.now());
    if(r.ok) manifest=await r.json();
  }catch(e){}
  if(!manifest){
    const local=JSON.parse(localStorage.getItem('bloblive_library')||'[]');
    const s=local.find(x=>x.id===id);
    if(s) manifest={title:s.title,live_key:s.liveKey,chunks:s.blobs.map(b=>({n:b.n,blob:b.blob,keyIdx:b.keyIdx})),captions:[]};
  }
  if(!manifest){ $('stat').textContent='stream not found'; return; }
  // key can come from URL fragment (shared link) — fragment never hits the server
  const fragKey=location.hash.slice(1);
  if(fragKey&&fragKey.length>=64) manifest.live_key=fragKey;
  $('title').textContent='📼 '+manifest.title;
  keyChain=[bhex(manifest.live_key||manifest.liveKey)];
  $('proof').textContent=`🔑 ${String(manifest.live_key||manifest.liveKey).slice(0,32)}… · ${manifest.chunks.length} chunks · proof: sha256(live_key|chunks)`;
  // verified gameplay badge + score highlights
  if(manifest.verified) $('proof').innerHTML+='<br><span style="color:#7CFF6B">✅ VERIFIED HUMAN GAMEPLAY — camera + screen composited</span>';
  if(manifest.finalScore) $('proof').innerHTML+=`<br>🏆 final score: <b>${manifest.finalScore}</b>`;
  if(manifest.scoreEvents&&manifest.scoreEvents.length){
    $('highlights').innerHTML='<span class="lbl">🎬 HIGHLIGHTS — click to jump:</span><br>'+manifest.scoreEvents.map((e,i)=>
      `<button class="btn" style="font-size:.8rem" onclick="jumpTo(${e.chunk})">[${e.t}] ${e.type} → ${e.score}</button>`
    ).join(' ');
  }
  startMSE();
}
function jumpTo(chunk){
  playIdx=Math.max(0,chunk-1);
  if(ms&&ms.readyState==='open'){ try{ms.endOfStream();}catch(e){} }
  startMSE();
}
function startMSE(){
  const v=$('v');
  if(!window.MediaSource){
    // 📱 phone: no MSE — fetch+decrypt all, concat, play as one video
    startPhone();
    return;
  }
  ms=new MediaSource(); v.src=URL.createObjectURL(ms);
  ms.addEventListener('sourceopen',()=>{ sb=ms.addSourceBuffer('video/webm;codecs=vp9'); playLoop(); });
}
/* Phone playback: download every chunk, decrypt, concat into one blob URL */
async function startPhone(){
  const v=$('v');
  const buf=[]; let ok=0, skipped=0;
  const reasons=[];
  const total=manifest.chunks.length;
  const mime=(manifest.mime||'video/webm').split(';')[0];
  for(let i=0;i<total;i++){
    const c=manifest.chunks[i];
    $('pos').textContent=`chunk ${i+1} / ${total}`;
    $('stat').textContent=`📱 decrypting ${i+1}/${total}…`;
    try{
      if(!c||!c.blob||String(c.blob).startsWith('PUT-FAILED')) throw new Error('bad blob ID');
      const key=await keyAt(c.keyIdx??c.n??i);
      const r=await fetch(AGG+'/v1/blobs/'+c.blob);
      if(!r.ok) throw new Error('Walrus HTTP '+r.status);
      const cipher=new Uint8Array(await r.arrayBuffer());
      const plain=unwrap(cipher,key);
      if(!plain) throw new Error('decrypt failed — wrong key?');
      buf.push(new Uint8Array(plain)); ok++;
    }catch(e){ skipped++; if(reasons.length<5) reasons.push(`chunk ${i}: ${e.message}`); }
  }
  if(!ok){
    $('stat').innerHTML='✗ <b>0 chunks playable.</b><br>'+reasons.map(r=>'· '+r).join('<br>');
    if(window.errcatch) errcatch('play-phone: 0 chunks playable','startPhone');
    return;
  }
  const blob=new Blob(buf,{type:mime});
  v.src=URL.createObjectURL(blob);
  v.controls=true;
  v.play().catch(()=>{});
  // captions still work — show on timeupdate
  v.addEventListener('timeupdate',()=>{
    const idx=Math.floor(v.currentTime/2);
    const cap=(manifest.captions||[]).find(x=>x.chunk===idx);
    if(cap) $('caption').textContent='💬 '+cap.text;
  });
  $('stat').innerHTML=`✓ 📱 playing ${ok}/${total} chunks as one video`+(skipped?` (${skipped} skipped)<br><span style="font-size:.75rem">${reasons.join('<br>')}</span>`:'');
}
async function playLoop(){
  if(playing) return; playing=true;
  const v=$('v');
  let played=0, skipped=0;
  const skipReasons=[];
  while(playIdx<manifest.chunks.length){
    const c=manifest.chunks[playIdx];
    $('pos').textContent=`chunk ${playIdx+1} / ${manifest.chunks.length}`;
    $('stat').textContent='fetching chunk '+(playIdx+1)+'…';
    try{
      if(!c.blob||c.blob.startsWith('PUT-FAILED')) throw new Error('bad blob ID: '+String(c.blob).slice(0,30));
      const key=await keyAt(c.keyIdx??c.n);
      const r=await fetch(AGG+'/v1/blobs/'+c.blob);
      if(!r.ok) throw new Error('Walrus HTTP '+r.status);
      const cipher=new Uint8Array(await r.arrayBuffer());
      const plain=unwrap(cipher,key);
      if(!plain) throw new Error('decrypt failed — wrong key?');
      await new Promise((res,rej)=>{
        const on=()=>{sb.removeEventListener('updateend',on);res();};
        sb.addEventListener('updateend',on);
        try{sb.appendBuffer(plain);}catch(e){rej(e);}
      });
      // captions
      const cap=(manifest.captions||[]).find(x=>x.chunk===playIdx);
      if(cap) $('caption').textContent='💬 '+cap.text;
      playIdx++; played++;
      v.play().catch(()=>{});
      $('stat').textContent='playing… ('+played+' ok'+(skipped?', '+skipped+' skipped':'')+')';
    }catch(e){
      skipped++;
      if(skipReasons.length<5) skipReasons.push(`chunk ${playIdx}: ${e.message}`);
      $('stat').innerHTML='⚠ '+e.message+' (skipping)<br><span style="font-size:.75rem">'+skipReasons.join('<br>')+'</span>';
      playIdx++;
    }
  }
  if(played===0){
    $('stat').innerHTML='✗ <b>0 chunks played.</b><br>'+skipReasons.map(r=>'· '+r).join('<br>');
    if(window.errcatch) errcatch('play: 0 chunks playable','playLoop');
  } else {
    $('stat').textContent=`✓ finished — ${played} played, ${skipped} skipped`;
  }
}
function scrub(pct){
  // jump to chunk (DVR scrub — re-init required for simplicity: reload from chunk)
  const idx=Math.floor(pct/100*manifest.chunks.length);
  playIdx=idx;
  if(ms&&ms.readyState==='open'){ try{ms.endOfStream();}catch(e){} }
  startMSE();
}
load();
</script>
</body>
</html>
