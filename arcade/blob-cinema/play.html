<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>▶ BLOB CINEMA REPLAY</title>
<style>
body{background:#07070f;color:#e8e8ff;font-family:system-ui,sans-serif;margin:0;padding:14px;padding-bottom:80px}
.lbl{color:#9a9ac0;font-size:.8rem}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.panel{background:#101022;border:1px solid #26264d;border-radius:12px;padding:14px;margin:12px 0}
video{width:100%;max-width:800px;background:#000;border-radius:8px}
.btn{background:#1a1a33;border:1px solid #33336a;color:#e8e8ff;border-radius:8px;padding:8px 14px;cursor:pointer;margin:4px;text-decoration:none;display:inline-block}
#timeline{width:100%;max-width:800px;margin:8px 0}
.cap{color:#ffd76b;font-size:.9rem;min-height:1.2em}
#bnav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#141428;border-top:2px solid #6C5CE7;display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#bnav a{color:#b0b0e0;text-decoration:none;font-size:1.3rem;display:flex;flex-direction:column;align-items:center;min-width:52px}
#bnav a span{font-size:.6rem;margin-top:2px}
</style>
</head>
<body>
<script src="./errcatch.js"></script>
<script src="./nacl-min.js"></script>
<h1>▶ <span id="title">loading…</span></h1>
<p class="lbl"><a href="./reblob.html">📚 library</a> · <a href="./live.html">🔴 live</a> · <a href="./index.html">← theater</a></p>
<div class="panel">
  <video id="v" controls playsinline></video><br>
  <input type="range" id="timeline" min="0" max="100" value="0" oninput="scrub(this.value)">
  <div><span class="lbl" id="pos">chunk 0 / 0</span> · <span class="lbl" id="stat">loading manifest…</span></div>
  <div class="cap" id="caption"></div>
  <div id="highlights" style="margin:8px 0"></div>
  <div class="mono" style="font-size:.75rem;margin-top:8px" id="proof"></div>
</div>
<nav id="bnav">
<a href="./how.html">🎬<span>make</span></a>
<a href="./premiere.html">▶<span>watch</span></a>
<a href="./live-now.html">📡<span>live</span></a>
<a href="./follow.html">🔗<span>follow</span></a>
<a href="./reblob.html">📚<span>library</span></a>
<a href="../index.html">🕹<span>arcade</span></a>
</nav>
<script>
const GH='https://arcade.highscores.live/arcade/blob-cinema';
const AGG='https://aggregator.walrus-testnet.walrus.space';
const $=id=>document.getElementById(id);
const hex=b=>Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join('');
const bhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
// Pure-JS SHA-256 — no crypto.subtle dependency
function sha256bytes(data){
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var l=data.length, bitLen=l*8, padLen=(((l+1+8+63)>>6)<<6);
  var m=new Uint8Array(padLen); m.set(data); m[l]=0x80;
  var dv=new DataView(m.buffer);
  dv.setUint32(padLen-8, Math.floor(bitLen/4294967296)); dv.setUint32(padLen-4, bitLen>>>0);
  var w=new Uint32Array(64);
  function rotr(x,n){return (x>>>n)|(x<<(32-n));}
  for(var off=0;off<padLen;off+=64){
    for(var i=0;i<16;i++) w[i]=dv.getUint32(off+i*4);
    for(var i=16;i<64;i++){
      var s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3);
      var s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(var i=0;i<64;i++){
      var S1=rotr(e,6)^rotr(e,11)^rotr(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[i]+w[i])|0;
      var S0=rotr(a,2)^rotr(a,13)^rotr(a,22), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  var out=new Uint8Array(32), odv=new DataView(out.buffer);
  for(var i=0;i<8;i++) odv.setUint32(i*4,H[i]>>>0);
  return out;
}
function deriveKey(prev){
  const input=new Uint8Array([...prev,...new TextEncoder().encode('|next')]);
  return sha256bytes(input);
}
let manifest=null, keyChain=[], playIdx=0;
let _keyLock=Promise.resolve();
async function keyAt(i){
  const p=_keyLock.then(async()=>{
    while(keyChain.length<=i) keyChain.push(deriveKey(keyChain[keyChain.length-1]));
    return keyChain[i];
  });
  _keyLock=p.catch(()=>{});
  return p;
}
function unwrap(cipher,key){
  const d=nacl.secretbox.open(cipher.slice(24),cipher.slice(0,24),key);
  return d?new Uint8Array(d):null;
}
function tryPlay(v){
  const p=v.play();
  if(p&&p.catch) p.catch(()=>{
    if(v.dataset.tapShown) return;
    v.dataset.tapShown='1';
    const ov=document.createElement('div');
    ov.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:5;cursor:pointer';
    ov.innerHTML='<div style="font-size:3rem;background:#6C5CE7;border-radius:50%;width:90px;height:90px;display:flex;align-items:center;justify-content:center">▶</div>';
    ov.onclick=()=>{ v.play().catch(()=>{}); ov.remove(); };
    v.parentElement.style.position='relative';
    v.parentElement.appendChild(ov);
  });
}
async function load(){
  const id=new URLSearchParams(location.search).get('id');
  const keyHex=location.hash.slice(1);
  if(!id){ $('stat').textContent='no stream id'; return; }
  // try localStorage first (library), then GitHub
  try{
    const lib=JSON.parse(localStorage.getItem('bloblive_library')||'[]');
    const s=lib.find(x=>x.id===id);
    if(s){
      manifest={title:s.title,chunks:s.blobs||[],live_key:s.liveKey,mime:s.mime};
      if(s.manifest){
        try{
          const r=await fetch(AGG+'/v1/blobs/'+s.manifest);
          if(r.ok){ const m=await r.json(); if(m.chunks) manifest.chunks=m.chunks; }
        }catch(e){}
      }
    }
  }catch(e){}
  if(!manifest){
    $('stat').textContent='stream not found'; return;
  }
  $('title').textContent=manifest.title||'untitled';
  keyChain=[bhex(keyHex||manifest.live_key||'')];
  const total=manifest.chunks.length;
  $('proof').textContent=`🔑 ${keyHex.slice(0,32)}… · ${total} chunks · proof: sha256(live_key|chunks)`;
  // phone path: no MediaSource → concat and play
  if(!window.MediaSource){ startPhone(total); return; }
  startMSE(total);
}
async function startPhone(total){
  const v=$('v'), buf=[];
  let ok=0, skipped=0, mime='', started=false;
  const errs=[];
  for(let i=0;i<total;i++){
    const c=manifest.chunks[i];
    $('pos').textContent=`chunk ${i+1} / ${total}`;
    $('stat').textContent=`📱 decrypting ${i+1}/${total}…`;
    try{
      if(!c||!c.blob||String(c.blob).startsWith('PUT-FAILED')) throw new Error('bad blob ID');
      const r=await fetch(AGG+'/v1/blobs/'+c.blob);
      if(!r.ok) throw new Error('Walrus HTTP '+r.status);
      const cipher=new Uint8Array(await r.arrayBuffer());
      let plain=null;
      const maxK=Math.max(total,keyChain.length)+2;
      for(let tk=0;tk<maxK&&!plain;tk++) plain=unwrap(cipher,await keyAt(tk));
      if(!plain) throw new Error('decrypt failed — no key unlocked it');
      const bytes=new Uint8Array(plain);
      if(!mime) mime=(bytes[4]===0x66&&bytes[5]===0x74&&bytes[6]===0x79&&bytes[7]===0x70)?'video/mp4':(bytes[0]===0x1A&&bytes[1]===0x45&&bytes[2]===0xDF&&bytes[3]===0xA3)?'video/webm':'video/mp4';
      buf.push(bytes); ok++;
      if(!started&&ok>=1){
        started=true;
        v.src=URL.createObjectURL(new Blob(buf,{type:mime}));
        v.muted=true;
        tryPlay(v);
      } else if(started&&ok%6===0){
        const t=v.currentTime;
        v.src=URL.createObjectURL(new Blob(buf,{type:mime}));
        try{ v.currentTime=t; }catch(e){}
      }
    }catch(e){
      skipped++;
      if(errs.length<5) errs.push(`chunk ${i}: ${e.message}`);
    }
  }
  $('stat').innerHTML=`✓ 📱 playing ${ok}/${total} chunks as one video (${skipped} skipped)`+(errs.length?'<br>'+errs.join('<br>'):'');
  if(!ok&&window.errcatch) errcatch('play-phone: 0 chunks playable','startPhone');
}
function scrub(pct){
  const v=$('v');
  if(v.duration) v.currentTime=v.duration*pct/100;
}
async function startMSE(total){
  const v=$('v');
  $('stat').textContent='starting…';
  const mime=(manifest.mime||'video/webm;codecs=vp9').split(';')[0];
  const ms=new MediaSource();
  v.src=URL.createObjectURL(ms);
  ms.addEventListener('sourceopen',async()=>{
    let sb;
    try{ sb=ms.addSourceBuffer('video/webm;codecs=vp9'); }
    catch(e){ try{ sb=ms.addSourceBuffer('video/mp4'); }catch(e2){ $('stat').textContent='MSE unsupported'; return; } }
    let played=0, skipped=0;
    for(let idx=0;idx<total;idx++){
      const c=manifest.chunks[idx];
      $('pos').textContent=`chunk ${playIdx+1} / ${total}`;
      $('stat').textContent='fetching chunk '+(playIdx+1)+'…';
      try{
        if(!c.blob||c.blob.startsWith('PUT-FAILED')) throw new Error('bad blob ID');
        const r=await fetch(AGG+'/v1/blobs/'+c.blob);
        if(!r.ok) throw new Error('Walrus HTTP '+r.status);
        const cipher=new Uint8Array(await r.arrayBuffer());
        let plain=null;
        const maxK=Math.max(total,keyChain.length)+2;
        for(let tk=0;tk<maxK&&!plain;tk++) plain=unwrap(cipher,await keyAt(tk));
        if(!plain) throw new Error('decrypt failed');
        await new Promise((res,rej)=>{
          const on=()=>{sb.removeEventListener('updateend',on);res();};
          sb.addEventListener('updateend',on);
          try{sb.appendBuffer(plain);}catch(e){rej(e);}
        });
        playIdx++; played++;
        v.play().catch(()=>{});
        $('stat').textContent='playing… ('+played+' ok'+(skipped?', '+skipped+' skipped':'')+')';
      }catch(e){ skipped++; }
    }
    if(ms.readyState==='open'){ try{ms.endOfStream();}catch(e){} }
  });
  // highlights
  if(manifest.highlights&&manifest.highlights.length){
    $('highlights').innerHTML='<b>🎬 HIGHLIGHTS</b><br>'+manifest.highlights.map((h,i)=>`<button class="btn" onclick="seekHi(${i})">${h.label||('🔥 '+(i+1))}</button>`).join('');
  }
  window.seekHi=i=>{
    const h=manifest.highlights[i];
    if(h&&v.duration) v.currentTime=v.duration*(h.at||0);
  };
}
load();
</script>
</body>
