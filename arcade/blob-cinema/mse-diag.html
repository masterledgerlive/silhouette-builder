<!DOCTYPE html><html><head><meta charset="utf-8"><title>MSE diagnostic</title></head><body>
<h2>MSE diagnostic — minimal record → append → play</h2>
<div id="out" style="font-family:monospace;white-space:pre-wrap"></div>
<canvas id="cv" width="320" height="180" style="border:1px solid #333"></canvas><br>
<video id="v" controls muted style="width:320px;background:#000"></video>
<script>
const out=(t)=>{document.getElementById('out').textContent+=t+'\n';};
// minimal nacl secretbox stub for diag — uses real crypto via subtle? No, just XOR for format test
// Actually: we test if ENCRYPT-THEN-DECRYPT preserves bytes exactly
function xorCrypt(data,keyByte){ const o=new Uint8Array(data.length); for(let i=0;i<data.length;i++)o[i]=data[i]^keyByte; return o; }
async function run(){
  out('=== DIAG: record → encrypt → decrypt → append (separate) ===');
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let t=0;
  const timer=setInterval(()=>{t+=0.1;ctx.fillStyle='#102';ctx.fillRect(0,0,320,180);
    ctx.fillStyle='hsl('+(t*50%360)+',80%,60%)';ctx.beginPath();ctx.arc(160,90,40+20*Math.sin(t),0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillText('t='+t.toFixed(1),10,20);},50);
  const stream=cv.captureStream(30);
  const mime='video/webm;codecs=vp9';
  const rec=new MediaRecorder(stream,{mimeType:mime});
  const v=document.getElementById('v');
  const ms=new MediaSource(); v.src=URL.createObjectURL(ms);
  let sb=null, chunkIdx=0, okCount=0, failCount=0;
  ms.addEventListener('sourceopen',()=>{
    out('sourceopen');
    try{ sb=ms.addSourceBuffer(mime); out('SB OK'); rec.start(2000); }
    catch(e){ out('SETUP FAIL: '+(e.message||e)); }
  });
  rec.ondataavailable=async e=>{
    if(!e.data||!e.data.size) return;
    const idx=chunkIdx++;
    const raw=new Uint8Array(await e.data.arrayBuffer());
    // encrypt → decrypt (simulating live.html pipeline)
    const enc=xorCrypt(raw, 0xAB);
    const dec=xorCrypt(enc, 0xAB);
    const same = raw.length===dec.length && raw.every((b,i)=>b===dec[i]);
    out(`chunk #${idx}: ${raw.length}b, roundtrip ${same?'OK':'CORRUPT'}`);
    if(!same){ out('FATAL: encrypt/decrypt corrupted data'); return; }
    if(!sb||sb.updating){ out('skip '+idx); return; }
    try{
      await new Promise((res,rej)=>{
        const on=()=>{sb.removeEventListener('updateend',on);res();};
        sb.addEventListener('updateend',on);
        sb.appendBuffer(dec);
      });
      okCount++; out(`append #${idx} OK`);
      if(idx===0) v.play().catch(()=>{});
    }catch(e){ failCount++; out(`append #${idx} FAIL: ${(e.message||e)}`); }
  };
  await new Promise(r=>setTimeout(r,9000));
  rec.stop(); clearInterval(timer);
  out(`DONE: ${okCount} ok, ${failCount} failed`);
}
run();
</script></body></html>
