<!DOCTYPE html><html><head><meta charset="utf-8"><title>MSE diagnostic</title></head><body>
<h2>MSE diagnostic — minimal record → append → play</h2>
<div id="out" style="font-family:monospace;white-space:pre-wrap"></div>
<canvas id="cv" width="320" height="180" style="border:1px solid #333"></canvas><br>
<video id="v" controls muted style="width:320px;background:#000"></video>
<script>
const out=(t)=>{document.getElementById('out').textContent+=t+'\n';};
async function run(){
  out('MediaSource supported: '+!!window.MediaSource);
  const mimes=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm;codecs=vp9,opus','video/webm','video/mp4'];
  mimes.forEach(m=>out(m+' → rec:'+(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))+' mse:'+(window.MediaSource&&MediaSource.isTypeSupported(m))));
  // draw pattern
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let t=0;
  const timer=setInterval(()=>{t+=0.1;ctx.fillStyle='#102';ctx.fillRect(0,0,320,180);
    ctx.fillStyle='hsl('+(t*50%360)+',80%,60%)';ctx.beginPath();ctx.arc(160,90,40+20*Math.sin(t),0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillText('t='+t.toFixed(1),10,20);},50);
  const stream=cv.captureStream(30);
  out('stream tracks: video='+stream.getVideoTracks().length+' audio='+stream.getAudioTracks().length);
  const mime='video/webm;codecs=vp9';
  // REPLICATE LIVE: 2000ms timeslice, append each chunk SEPARATELY
  const rec=new MediaRecorder(stream,{mimeType:mime});
  const v=document.getElementById('v');
  const ms=new MediaSource(); v.src=URL.createObjectURL(ms);
  let sb=null, chunkIdx=0, okCount=0, failCount=0;
  ms.addEventListener('sourceopen',()=>{
    out('sourceopen, readyState='+ms.readyState);
    try{
      sb=ms.addSourceBuffer(mime);
      out('addSourceBuffer OK — now recording 2s chunks, appending separately...');
      sb.addEventListener('error',()=>out('!! SourceBuffer ERROR event'));
      rec.start(2000);
    }catch(e){ out('SETUP FAILED: '+(e.message||e)); }
  });
  ms.addEventListener('sourceclose',()=>out('source CLOSED'));
  rec.ondataavailable=async e=>{
    if(!e.data||!e.data.size) return;
    const idx=chunkIdx++;
    const buf=new Uint8Array(await e.data.arrayBuffer());
    const magic=Array.from(buf.slice(0,4)).map(b=>b.toString(16).padStart(2,'0')).join('');
    out(`chunk #${idx}: ${buf.length} bytes, magic=${magic}${idx===0?' (INIT?)':''}`);
    if(!sb){ out('no SB yet, skipping'); return; }
    if(sb.updating){ out('SB busy, skipping chunk '+idx); return; }
    try{
      await new Promise((res,rej)=>{
        const on=()=>{sb.removeEventListener('updateend',on);res();};
        const onErr=()=>{sb.removeEventListener('updateend',on);rej(new Error('SB error event'));};
        sb.addEventListener('updateend',on); sb.addEventListener('error',onErr);
        sb.appendBuffer(buf);
      });
      okCount++;
      out(`chunk #${idx} appended OK (${okCount} ok)`);
      if(idx===0) v.play().then(()=>out('playing!')).catch(e=>out('play: '+e.message));
    }catch(e){ failCount++; out(`chunk #${idx} FAILED: ${(e.message||e)} (${failCount} fails)`); }
  };
  await new Promise(r=>setTimeout(r,9000));
  rec.stop(); clearInterval(timer);
  out(`DONE: ${okCount} appended, ${failCount} failed`);
}
run();
</script></body></html>
