<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🟣 BLOBPLAYER</title>
<style>
*{box-sizing:border-box}
body{background:linear-gradient(135deg,#0a0a1a,#1a0a2a);color:#e8e8ff;font-family:system-ui,sans-serif;margin:0;padding:20px;min-height:100vh;padding-bottom:90px}
h1{text-align:center;font-size:2rem;margin:10px 0}
.sub{text-align:center;color:#8888aa;font-size:.9rem;margin-bottom:24px}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;max-width:700px;margin:0 auto}
.app{background:#141428;border:2px solid #2a2a4d;border-radius:16px;padding:20px 10px;text-align:center;text-decoration:none;color:#e8e8ff;transition:transform .15s,border-color .15s}
.app:hover{transform:scale(1.05);border-color:#6C5CE7}
.app .icon{font-size:3rem;display:block;margin-bottom:8px}
.app .name{font-size:.9rem;font-weight:600}
.app .desc{font-size:.7rem;color:#8888aa;margin-top:4px}
.check{padding:6px 10px;margin:4px 0;border-radius:6px;font-size:.85rem}
.check.ok{background:#0f2f15;border:1px solid #1a6b2a}
.check.fail{background:#2f0f15;border:1px solid #6b1a2a}
.check.wait{background:#1a1a2a;border:1px solid #333}
#bnav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#141428;border-top:2px solid #6C5CE7;display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#bnav a{color:#b0b0e0;text-decoration:none;font-size:1.3rem;display:flex;flex-direction:column;align-items:center;min-width:52px}
#bnav a span{font-size:.6rem;margin-top:2px}
</style>
</head>
<body>
<script src="./errcatch.js"></script>
<h1>🟣 BLOBPLAYER</h1>
<div class="sub">blockchain DVR — pure math, no magic<br>record → encrypt → Walrus → prove</div>

<div class="apps">
  <a class="app" href="./apps/record.html">
    <span class="icon">🔴</span>
    <span class="name">Record</span>
    <span class="desc">capture + encrypt to chain</span>
  </a>
  <a class="app" href="./apps/watch.html">
    <span class="icon">👁</span>
    <span class="name">Watch</span>
    <span class="desc">4 keys, one stream</span>
  </a>
  <a class="app" href="./apps/library.html">
    <span class="icon">📚</span>
    <span class="name">Library</span>
    <span class="desc">your videos on chain</span>
  </a>
  <a class="app" href="./apps/proof.html">
    <span class="icon">🔍</span>
    <span class="name">Proof</span>
    <span class="desc">verify any blob</span>
  </a>
</div>

<div style="max-width:700px;margin:24px auto">
  <h3>System Status</h3>
  <div id="checks"></div>
  <div style="text-align:center;margin-top:12px">
    <button onclick="BPC.runAll()" style="background:#1a1a33;border:1px solid #33336a;color:#e8e8ff;border-radius:8px;padding:10px 24px;cursor:pointer;font-size:1rem">▶ run system checks</button>
  </div>
</div>

<nav id="bnav">
<a href="./index.html">🟣<span>home</span></a>
<a href="./apps/record.html">🔴<span>record</span></a>
<a href="./apps/watch.html">👁<span>watch</span></a>
<a href="./apps/library.html">📚<span>library</span></a>
<a href="../index.html">🕹<span>arcade</span></a>
</nav>

<script src="./nacl-min.js"></script>
<script src="./kernel/protocol.js"></script>
<script src="./system/checks.js"></script>
<script>
// auto-run checks on load
window.addEventListener('load',()=>setTimeout(()=>BPC.runAll(),500));
</script>
</body>
</html>
