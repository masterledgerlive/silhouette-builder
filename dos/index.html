<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>KKN-DOS — Koda Kai Network Terminal</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:#020502; color:#33ff33;
    font-family:'Courier New', Courier, monospace;
    font-size:16px; line-height:1.5;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #crt {
    position:fixed; inset:0; padding:14px 14px 64px;
    overflow-y:auto; overflow-x:hidden;
    text-shadow:0 0 6px rgba(51,255,51,.75);
    cursor:text;
    scrollbar-width:thin; scrollbar-color:#1a5c1a #020502;
  }
  /* quick-launch bar */
  #quickbar {
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    display:flex; gap:6px; justify-content:center; align-items:center;
    padding:8px 6px; background:rgba(2,8,2,.92);
    border-top:1px solid #1f5c1f; overflow-x:auto;
    font-size:13px; white-space:nowrap;
  }
  #quickbar button {
    background:#031003; color:#33ff33; border:1px solid #1f5c1f; border-radius:6px;
    font-family:inherit; font-size:13px; padding:6px 9px; cursor:pointer;
    text-shadow:0 0 6px rgba(51,255,51,.7); flex:0 0 auto;
  }
  #quickbar button:active { background:#0a2a0a; }
  #quickbar .qk { color:#1f9d1f; margin-right:2px; }
  /* scanlines */
  #crt::after {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:50;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px);
  }
  /* vignette */
  #crt::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:51;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  #out { white-space:pre-wrap; word-break:break-word; }
  .dim { color:#1f9d1f; }
  .bright { color:#b6ffb6; }
  .warn { color:#ffe14d; text-shadow:0 0 6px rgba(255,225,77,.7); }
  #promptline { display:flex; align-items:baseline; }
  #prompt { flex:0 0 auto; padding-right:8px; }
  #linewrap { flex:1 1 auto; position:relative; min-width:0; }
  #mirror { white-space:pre-wrap; word-break:break-all; min-height:1.5em; }
  #suggest { color:#1f9d1f; opacity:.7; white-space:pre-wrap; word-break:break-all; }
  #cursor {
    display:inline-block; width:.6em; height:1.15em;
    background:#33ff33; vertical-align:-0.2em;
    box-shadow:0 0 8px rgba(51,255,51,.9);
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity:0; } }
  /* real input: invisible but focusable (mobile keyboard) */
  #kbd {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; border:0; padding:0; margin:0;
    font-size:16px; /* prevents iOS zoom */
    caret-color:transparent; color:transparent; background:transparent;
  }
  #hint {
    position:fixed; bottom:6px; left:0; right:0; text-align:center;
    color:#1f9d1f; font-size:11px; letter-spacing:.15em; z-index:52;
    pointer-events:none;
  }
  /* clickable title — the cheat: one tap reboots the terminal */
  #titlebar {
    position:fixed; top:0; left:0; right:0; z-index:60;
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 12px; background:rgba(2,8,2,.92);
    border-bottom:1px solid #1f5c1f; cursor:pointer;
    font-size:12px; letter-spacing:.15em; color:#33ff33;
    text-shadow:0 0 6px rgba(51,255,51,.7);
  }
  #titlebar .dim { color:#1f9d1f; font-size:10px; }
  #crt { padding-top:44px; }
</style>
</head>
<body>
<div id="titlebar"><span>▚ KKN-DOS</span><span class="dim">tap title to reboot</span></div>
<div id="crt" tabindex="-1">
  <div id="out"></div>
  <div id="promptline">
    <span id="prompt">C:\KKN&gt;</span>
    <span id="linewrap">
      <span id="mirror"></span><span id="suggest"></span><span id="cursor"></span>
      <input id="kbd" type="text" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" aria-label="terminal input">
    </span>
  </div>
</div>
<div id="hint">TAP TO TYPE &middot; &rarr; TO AUTOFILL &middot; UP/DOWN FOR HISTORY</div>

<script>
(function(){
  "use strict";
  var out = document.getElementById('out');
  var kbd = document.getElementById('kbd');
  var mirror = document.getElementById('mirror');
  var crt = document.getElementById('crt');

  var HUB = 'https://arcade.highscores.live/';

  var SYSTEMS = {
    radio:      { name:'Network Radio/TV',        url:'https://arcade.highscores.live/arcade/kodakainetwork/' },
    bridge:     { name:'KKN Bridge',              url:'https://arcade.highscores.live/bridge/' },
    arcade:     { name:'Arcades of Time',          url:'https://arcade.highscores.live/arcade/' },
    cinema:     { name:'Blob Cinema',              url:'https://arcade.highscores.live/arcade/blob-cinema/' },
    silhouette: { name:'Silhouette Creator',       url:'https://arcade.highscores.live/silouttes/' },
    builder:    { name:'Blob Arcade Builder',        url:'https://arcade.highscores.live/arcade/builder/' },
    floor:      { name:'1980s Floor (carousel)',     url:'https://arcade.highscores.live/arcade/floor.html' },
    doom:       { name:'DOOM',                     url:'https://arcade.highscores.live/arcade/doom/' },
    live:       { name:'Blob Live',                url:'https://arcade.highscores.live/arcade/blob-cinema/live.html' },
    follow:     { name:'Chain Follower',           url:'https://arcade.highscores.live/arcade/blob-cinema/follow.html' },
    how:        { name:'How It Works',             url:'https://arcade.highscores.live/arcade/blob-cinema/how.html' },
    livenow:    { name:'Live Now',                 url:'https://arcade.highscores.live/arcade/blob-cinema/live-now.html' },
    studio:     { name:'Studio',                   url:'https://arcade.highscores.live/arcade/blob-cinema/studio.html' },
    reblob:     { name:'Reblob Library',           url:'https://arcade.highscores.live/arcade/blob-cinema/reblob.html' },
    scores:     { name:'Hall of Scores',           url:'https://arcade.highscores.live/arcade/blob-cinema/scores.html' },
    play:       { name:'Replay DVR',               url:'https://arcade.highscores.live/arcade/blob-cinema/play.html' },
    sliders:    { name:'Sliders (prototype)',      url:'https://arcade.highscores.live/arcade/blob-cinema/sliders.html' },
    bbb:        { name:'BBB (prototype)',          url:'https://arcade.highscores.live/arcade/blob-cinema/bbb.html' },
    diag:       { name:'MSE Diagnostics',          url:'https://arcade.highscores.live/arcade/blob-cinema/mse-diag.html' },
    'theater-old': { name:'Blob Theater (origin)', url:'https://arcade.highscores.live/arcade/blob-theater/' },
    github:     { name:'GitHub Control Room',        url:'https://arcade.highscores.live/arcade/github.html' },
    linktree:   { name:'Linktree Mirror',            url:'https://arcade.highscores.live/arcade/linktree.html' },
    tickets:    { name:'Ticket Hunter AI',         building:true },
    stadium:    { name:'Fan-Owned Stadium',        building:true },
    decoder:    { name:'Decoder Lab',              building:true },
    guardian:   { name:'Guardian Protocol',        infra:true, desc:'the hive pathway — mother-chain anchoring' }
  };

  var GROUPS = [
    { title:'[INFRASTRUCTURE]', ids:['guardian'] },
    { title:'[NETWORK]',        ids:['radio','bridge','arcade','cinema','silhouette','github','linktree'] },
    { title:'[ARCADE CABINETS]', ids:['doom','live','follow','how','livenow','studio','reblob','scores','play','sliders','bbb','diag','theater-old'] },
    { title:'[BUILDING]',       ids:['tickets','stadium','decoder'] }
  ];

  var history = [], hIndex = -1;

  function print(html, cls){
    var d = document.createElement('div');
    if(cls) d.className = cls;
    d.innerHTML = html;
    out.appendChild(d);
    crt.scrollTop = crt.scrollHeight;
  }
  function esc(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function focusKbd(){ kbd.focus({preventScroll:true}); }

  crt.addEventListener('click', focusKbd);
  crt.addEventListener('touchstart', focusKbd, {passive:true});

  function syncMirror(){ mirror.textContent = kbd.value; showSuggest(); }

  /* ---------- autocomplete: right-arrow fills ---------- */
  var COMMANDS = ['HELP','DIR','VER','CLS','CLEAR','EXIT','MATRIX','CREATE'];
  function candidates(){
    var w = COMMANDS.slice();
    for(var id in SYSTEMS){ w.push(id.toUpperCase()); }
    return w;
  }
  function findSuggest(){
    var v = kbd.value.toUpperCase();
    if(!v) return '';
    var w = candidates();
    for(var i=0;i<w.length;i++){
      if(w[i].indexOf(v) === 0 && w[i] !== v) return w[i].slice(v.length);
    }
    return '';
  }
  function showSuggest(){
    var s = document.getElementById('suggest');
    if(s) s.textContent = findSuggest();
  }
  function acceptSuggest(){
    var suf = findSuggest();
    if(suf){
      kbd.value = kbd.value.toUpperCase() + suf;
      syncMirror();
      return true;
    }
    return false;
  }

  /* ---------- title cheat: tap to reboot ---------- */
  document.getElementById('titlebar').addEventListener('click', function(e){
    e.stopPropagation();
    out.innerHTML = '';
    bi = 0;
    print('<span class="dim">-- reboot --</span>');
    stepBoot();
  });

  kbd.addEventListener('input', syncMirror);

  kbd.addEventListener('keydown', function(e){
    if(e.key === 'ArrowUp'){
      e.preventDefault();
      if(history.length){
        if(hIndex < 0) hIndex = history.length;
        if(hIndex > 0) hIndex--;
        kbd.value = history[hIndex]; syncMirror();
      }
    } else if(e.key === 'ArrowDown'){
      e.preventDefault();
      if(hIndex >= 0){
        hIndex++;
        kbd.value = (hIndex >= history.length) ? '' : history[hIndex];
        if(hIndex >= history.length) hIndex = -1;
        syncMirror();
      }
    } else if(e.key === 'Enter'){
      var raw = kbd.value;
      kbd.value = ''; syncMirror(); hIndex = -1;
      runCmd(raw);
    } else if(e.key === 'ArrowRight'){
      if(acceptSuggest()) e.preventDefault();
    }
  });

  function cmdHelp(){
    print('Available commands:');
    print('  HELP      this list');
    print('  DIR       list all systems');
    print('  VER       version info');
    print('  CLS       clear the screen');
    print('  EXIT      back to the hub');
    print('  &lt;name&gt;    open a system (try RADIO, DOOM, SCORES, CREATE...)');
    print('  MATRIX    ???');
  }

  function cmdDir(){
    print('');
    GROUPS.forEach(function(g){
      print('<span class="bright">' + g.title + '</span>');
      g.ids.forEach(function(id){
        var s = SYSTEMS[id];
        var tag = s.building
          ? '<span class="warn">[BUILDING]</span>'
          : s.infra
          ? '<span class="bright">[CORE]</span>    '
          : '<span class="dim">[LIVE]</span>    ';
        print('  ' + tag + ' ' + id.toUpperCase().padEnd(12,' ') + ' ' + esc(s.name));
      });
      print('');
    });
  }

  function runCmd(raw){
    print('C:\\KKN&gt; ' + esc(raw));
    var c = raw.trim().toUpperCase();
    if(!c) return;
    history.push(raw); if(history.length > 100) history.shift();

    if(c === 'HELP'){ cmdHelp(); return; }
    if(c === 'DIR'){ cmdDir(); return; }
    if(c === 'VER'){
      print('Koda Kai Network DOS v7.1 — the system of all systems');
      print('No pixels were harmed. All systems nominal.');
      return;
    }
    if(c === 'CLS' || c === 'CLEAR'){ out.innerHTML = ''; return; }
    if(c === 'EXIT'){
      print('Returning to the hub ...');
      setTimeout(function(){ window.location.href = HUB; }, 500);
      return;
    }
    if(c === 'MATRIX'){
      print('Wake up ... the Koda Kai Network has you. (No red pills here — only green text.)');
      return;
    }
    var id = c.toLowerCase().replace(/-/g,'-');
    // allow CREATE as an alias for the silhouette creator
    if(id === 'create') id = 'silhouette';
    if(SYSTEMS.hasOwnProperty(id)){
      var s = SYSTEMS[id];
      if(s.building){
        print(esc(s.name) + ' is still being built, chief.');
      } else if(s.infra){
        print('<span class="bright">' + esc(s.name) + '</span> — ' + esc(s.desc));
        print('Core infrastructure. Always on.');
      } else {
        print('opening ' + esc(s.name) + ' ...');
        window.open(s.url, '_blank');
      }
      return;
    }
    print('Bad command or file name — try HELP');
  }

  /* ---------- boot sequence ---------- */
  var boot = [
    { t:  60, h: '<span class="dim">  ~~    ~~    ~~<br>    ~~    ~~    ~~<br>  ~~    ~~    ~~</span>' },
    { t: 120, h: '<span class="bright">KODA KAI NETWORK DOS</span>  <span class="dim">v7.1</span>' },
    { t: 120, h: 'the system of all systems' },
    { t: 200, h: '' },
    { t:  90, h: '<span class="bright">INFRASTRUCTURE</span>' },
    { t:  90, h: '  [ROOT] MOTHER GENESIS BLOCKCHAIN' },
    { t:  90, h: '    |- merkle tree ...... every build hashed in' },
    { t:  90, h: '    |- blobs ............ carry the whole system' },
    { t:  90, h: '    |- container ........ travels whole, as a file' },
    { t:  90, h: '    |- reblob keeper .... no move missed (Walrus/Sui)' },
    { t:  90, h: '    |- guardian ......... the hive pathway [CORE]' },
    { t: 200, h: '' },
    { t:  90, h: '<span class="bright">SYSTEMS — type a name to spin it up</span>' },
    { t:  90, h: '  [NETWORK]  radio · arcade · cinema · silhouette' },
    { t:  90, h: '  [ARCADE]   doom · live · follow · how · livenow · studio ·' },
    { t:  90, h: '             reblob · scores · play · sliders · bbb · diag · theater-old' },
    { t:  90, h: '  [BUILDING] tickets · stadium · decoder' },
    { t: 200, h: '' },
    { t: 100, h: '<span class="bright">ALL SYSTEMS NOMINAL</span>' },
    { t: 100, h: 'Type HELP for commands, DIR for details.' },
    { t: 150, h: '' }
  ];
  var bi = 0;
  function stepBoot(){
    if(bi < boot.length){
      print(boot[bi].h);
      setTimeout(stepBoot, boot[bi].t); bi++;
    } else {
      focusKbd();
    }
  }
  stepBoot();
})();
</script>
<div id="quickbar">
  <button data-id="radio"><span class="qk">1</span>🎙</button>
  <button data-id="arcade"><span class="qk">2</span>👹</button>
  <button data-id="cinema"><span class="qk">3</span>🎬</button>
  <button data-id="silhouette"><span class="qk">4</span>✂️</button>
  <button data-id="doom"><span class="qk">5</span>💀</button>
  <button data-id="live"><span class="qk">6</span>🔴</button>
  <button data-id="scores"><span class="qk">7</span>🏆</button>
  <button data-id="play"><span class="qk">8</span>▶️</button>
  <button data-id="studio"><span class="qk">9</span>🎥</button>
  <button data-id="follow"><span class="qk">0</span>🔗</button>
  <button id="qb-dir">☰</button>
</div>
<script>
(function(){
  var urls = {
    radio:'https://arcade.highscores.live/arcade/kodakainetwork/',
    arcade:'https://arcade.highscores.live/arcade/',
    cinema:'https://arcade.highscores.live/arcade/blob-cinema/',
    silhouette:'https://arcade.highscores.live/silouttes/',
    doom:'https://arcade.highscores.live/arcade/doom/',
    live:'https://arcade.highscores.live/arcade/blob-cinema/live.html',
    scores:'https://arcade.highscores.live/arcade/blob-cinema/scores.html',
    play:'https://arcade.highscores.live/arcade/blob-cinema/play.html',
    studio:'https://arcade.highscores.live/arcade/blob-cinema/studio.html',
    follow:'https://arcade.highscores.live/arcade/blob-cinema/follow.html'
  };
  document.querySelectorAll('#quickbar button[data-id]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var u = urls[b.getAttribute('data-id')];
      if(u) window.open(u, '_blank');
    });
  });
  document.getElementById('qb-dir').addEventListener('click', function(e){
    e.stopPropagation();
    window.open('https://arcade.highscores.live/', '_blank');
  });
})();
</script>
</body>
</html>
